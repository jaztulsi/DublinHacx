name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static SPA
        env:
          # Switches vite.config.ts to the /DublinHacx/ base path + SPA mode for
          # GitHub Pages. This var must ONLY ever be set here — never in the Vercel
          # environment, or Vercel's asset base path breaks. See DEPLOYMENT.md.
          GITHUB_PAGES: "true"
          # Public Supabase values (anon key) — set as repo variables, baked into the client bundle.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Assemble Pages output
        run: |
          rm -rf _site
          cp -r dist/client _site
          # TanStack Start emits the SPA shell as _shell.html. Serve it as the
          # site entry, and as the 404 fallback so client-side deep links work.
          mv _site/_shell.html _site/index.html
          cp _site/index.html _site/404.html
          # Stop GitHub Pages' Jekyll from dropping files/dirs that start with "_".
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
